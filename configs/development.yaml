# 与 docker-compose 中 Postgres 一致；本机用：make up && make run-controller
server:
  addr: ":8080"
  log_level: info

database:
  dsn: "postgres://postgres:postgres@127.0.0.1:5433/mp_sched?sslmode=disable"
  log_queries: false

scheduler:
  max_concurrent_running: 20
  max_concurrent_slow: 3
  min_free_slots_for_fast: 4

controller:
  http:
    enable: true
    addr: ":8080"

callback:
  enable: false
  url: "http://127.0.0.1:9/hook"
  method: "POST"
  timeout_seconds: 10

worker:
  poll_ms: 200
  admitted_timeout_seconds: 0
  allowed_providers: []
  default_max_runtime_seconds: 3600
  runtime_sweeper_interval_seconds: 300

reconciler:
  enable: true
  interval_seconds: 10
  # 终态+残留 runtime_ref 时，按秒三次再观测后仍则 Stop；与 enable 共用 interval 仅控制列表扫描
  # orphan_reap_enable: true
  # orphan_reap_waits_s: [5, 15, 30]

# 与 docker-compose 中 ClickHouse 一致；不启用写库时 enable=false 即可
clickhouse:
  enable: false
  address: "127.0.0.1:9000"
  database: "default"
  user: "mp_sched"
  password: "mp_sched_dev"
  tls: false

# 与 mp-worker -config 对齐；e2e 默认 Load 本文件（见 E2E_CONFIG）
docker:
  # data_dir 空则 ApplyDefaults 落到系统临时目录下 mp_sched-docker
  config_file_container_path: "/etc/mp_sched/config.json"
  image_pull:
    enable: false
  # mounts 非空时每个任务都会 bind；路径须在本机存在，否则 Run 失败
  # mounts:
  #   - name: "shared"
  #     host_path: "/data/host"
  #     mount_path: "/data"
  oss:
    enable: false
  # 可选本机资源上限，与 task.res_* 校验；取消注释时与上方 docker 同一块，勿重复 docker: 根键
  # host_resources:
  #   max_cpu: "32"
  #   max_memory: "256Gi"
  #   gpu_ids: ["GPU-0", "GPU-1"]
