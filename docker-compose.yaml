# 本地开发：PostgreSQL + ClickHouse；controller / worker 在本机用 go run
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mp_sched
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mp_sched"]
      interval: 3s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.12-alpine
    # 与 internal/config 中 DefaultClickHouseUser/DefaultClickHousePassword 一致
    environment:
      CLICKHOUSE_USER: mp_sched
      CLICKHOUSE_PASSWORD: mp_sched_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DB: default
    ports:
      - "9000:9000" # native
      - "8123:8123" # http，可选
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user mp_sched --password 'mp_sched_dev' -q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
